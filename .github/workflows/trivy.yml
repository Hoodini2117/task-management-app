name: Trivy Scan

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    trivy:
        name: Filesystem Scan
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Run Trivy
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "table"
                  exit-code: "1"
                  ignore-unfixed: true
                  severity: "CRITICAL,HIGH"
