name: CI pipeline
on:
  workflow_dispatch:

  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  AWS_REGION: ap-south-1
jobs:
  backend:
    name: backend validation
    runs-on: ubuntu-latest

    steps:
      - name: checkout repositories
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
  backend-lint:
    name: backend linting
    runs-on: ubuntu-latest
    steps:
      - name: checkout repositories
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: run ruff
        working-directory: ./backend
        run: ruff check .
  frontend-test:
    name: frontend tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: checkout repositories
        uses: actions/checkout@v4

      - name: set up ndoe.js ${{matrix.node-version}}
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
          cache: npm
          cache-dependency-path: "frontend/package-lock.json"

      - name: install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --watchAll=false --passWithNoTests

  frontend-build:
    name: frontend-build
    needs: frontend-test
    runs-on: ubuntu-latest
    steps:
      - name: checkout repositories
        uses: actions/checkout@v4

      - name: set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "frontend/package-lock.json"

      - name: install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: build frontend
        working-directory: ./frontend
        run: npm run build

      - name: upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/build
  artifact-verification:
    name: artifact-verification
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
      - name: Show current directory and downlaod files
        run: |
          pwd
          ls -la
          ls -R
  docker-build:
    name: docker build images
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - artifact-verification
    steps:
      - name: checkout repositories
        uses: actions/checkout@v4
      - name: Build Backend Image
        run: |
          docker build \
            -t taskly-backend:latest \
            ./backend
      - name: Build Frontend Images
        run: |
          docker build \
            -t taskly-frontend:latest \
            ./frontend
      - name: Verify Images
        run: docker images
  trivy-scan:
    name: Scan Docker Images
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t taskly-backend:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t taskly-frontend:latest \
            ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskly-backend:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskly-frontend:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  ecr-push:
    if: github.ref == 'refs/heads/main'
    name: Push Images to Amazon ECR
    needs: trivy-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Backend Image
        run: |
          docker build -t taskly-backend ./backend

      - name: Build Frontend Image
        run: |
          docker build -t taskly-frontend ./frontend

      - name: Tag Backend Image
        run: |
          docker tag taskly-backend:latest \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/taskly-backend:latest

      - name: Tag Frontend Image
        run: |
          docker tag taskly-frontend:latest \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/taskly-frontend:latest

      - name: Push Backend Image
        run: |
          docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/taskly-backend:latest

      - name: Push Frontend Image
        run: |
          docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/taskly-frontend:latest
  deploy:
    needs: ecr-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: deploy script executable
        run: chmod +x deployment/deploy.sh
      - name: deploy app
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: ./deployment/deploy.sh
      - name: health-check
        run: chmod +x deployment/health-check.sh
      - name: run health-check
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: ./deployment/health-check.sh
