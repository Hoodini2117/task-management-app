version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: taskly-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - taskly-network

  frontend:
    build:
      context: ./frontend
    container_name: taskly-frontend

    ports:
      - "3001:80"

    env_file:
      - ./frontend/.env

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - taskly-network

networks:
  taskly-network:
    driver: bridge