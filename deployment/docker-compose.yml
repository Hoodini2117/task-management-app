version: "3.9"

services:
  backend:
    image: ${BACKEND_IMAGE}

    container_name: taskly-backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - taskly-network

  frontend:
    image: ${FRONTEND_IMAGE}

    container_name: taskly-frontend

    restart: unless-stopped

    ports:
      - "3001:80"

    env_file:
      - .env

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - taskly-network

networks:
  taskly-network:
    driver: bridge